name: security

on:
  push:
    branches: [develop-2.2, main]
  schedule:
    - cron: '0 6 * * 1' # lunedì 06:00 UTC
  workflow_dispatch:

env:
  # The active release train. Named once here and once in the `push` filter
  # above; part of the per-cycle branch switch (CLAUDE.md, "When switching
  # develop branch"), together with ci.yml and release.yml.
  RELEASE_TRAIN_BRANCH: develop-2.2

jobs:
  semgrep:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install semgrep (OSS, LGPL-2.1)
        run: pip install semgrep

      - name: Semgrep - community ruleset (bloccante)
        run: semgrep scan --config p/typescript --config p/nextjs --config p/nodejs --config p/react --config p/sql-injection --error

      # Directory intera filtrata per severità: una regola ERROR nuova entra da
      # sola in tutti i gate, senza modifiche sincronizzate qui, in
      # `security:sast` e in `.husky/pre-commit`.
      - name: Semgrep - regole custom ERROR-tier (bloccante)
        run: semgrep scan --config .semgrep/rules/ --severity ERROR --error

      - name: Semgrep - luke-mutation-requires-permission (WARNING, non bloccante)
        run: semgrep scan --config .semgrep/rules/mutation-requires-permission.yml

  gitleaks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Install gitleaks (CLI OSS/MIT — non gitleaks-action, che richiede licenza commerciale)
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz

      - run: gitleaks detect --source .

  # Bloccante. Era `continue-on-error: true` — "report-only sui push", con il
  # segnale vero delegato a `osv-weekly`. Ma `osv-weekly` non è mai partito una
  # volta: GitHub esegue i trigger `schedule` usando i workflow del **branch di
  # default**, e questo file non esiste su `main`. Risultato: l'unico job che
  # girava era volutamente non bloccante, e quello bloccante non aveva un file da
  # eseguire. Sono passate inosservate 24 vulnerabilità note, 3 delle quali
  # critiche sul layer di autenticazione.
  osv-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: google/osv-scanner-action/osv-scanner-action@v2.5.1

  # Copre il caso che il job su push non può coprire: una vulnerabilità
  # divulgata dopo l'ultimo commit, su codice fermo. Resta inerte finché questo
  # file non arriva anche su `main` — vedi il commento sopra.
  osv-weekly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: google/osv-scanner-action/osv-scanner-action@v2.5.1

  # Same job, aimed at the active release train, because the rule above cuts
  # both ways: a scheduled run reads the workflow from the default branch *and*
  # checks out the default branch, so `osv-weekly` covers `main` and nothing
  # else. `osv-push` is the train's only coverage, and it rides on pushes —
  # which stop precisely during the RC freeze, the weeks when the train is a
  # deployed artifact under test and no longer changing. That is the window
  # this job exists for.
  #
  # An explicit second job rather than a matrix over a branch list: the branch
  # is one name, changed once per cycle, and a matrix would buy generality this
  # repository has never needed.
  #
  # It is deliberately not tolerant of a missing branch. Once the train is
  # merged and deleted this job goes red, `notify-on-failure` opens an issue,
  # and that is the reminder to retarget `RELEASE_TRAIN_BRANCH` at the next
  # train — or to delete this job if there isn't one yet. A silent skip would
  # instead let a whole cycle run with the train unscanned and nothing saying so.
  osv-weekly-release-train:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TRAIN_BRANCH }}
      - uses: google/osv-scanner-action/osv-scanner-action@v2.5.1

  # `contains(needs.*.result, 'failure')` ignora gli skip: i job push-only sono
  # 'skipped' (non 'failure') sui trigger schedule, e viceversa, quindi questo
  # gate si comporta correttamente su entrambi i trigger. `if: always()` è
  # necessario perché senza, un job 'skipped' tra i needs farebbe skippare
  # anche questo. Dedup via ricerca issue aperta con label `security-ci-failure`
  # — un'unica issue aggiornata a commenti finché qualcuno non la chiude,
  # niente spam a ogni run settimanale che continua a fallire. Canale scelto:
  # GitHub Issue, perché non esiste uno Slack/webhook nel repo — niente nuovo
  # secret da gestire.
  notify-on-failure:
    needs: [semgrep, gitleaks, osv-push, osv-weekly, osv-weekly-release-train]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const label = 'security-ci-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const branch = context.ref.replace('refs/heads/', '');

            const results = JSON.parse(process.env.JOB_RESULTS);
            const failedJobs = Object.entries(results)
              .filter(([, job]) => job.result === 'failure')
              .map(([name]) => name)
              .join(', ');

            const labels = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (!labels.data.some((l) => l.name === label)) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'b60205',
                description: 'security.yml workflow failed — needs triage',
              });
            }

            const body = [
              `Failed job(s): **${failedJobs}**`,
              `Branch: \`${branch}\` — trigger: \`${context.eventName}\``,
              `Run: ${runUrl}`,
            ].join('\n');

            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (openIssues.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssues.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Security workflow failing on ${branch}`,
                body,
                labels: [label],
              });
            }
