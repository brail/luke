name: CI

on:
  push:
    branches: [main, develop-2.2]
    # Documentation ownership surface: a push confined to these paths skips CI
    # and docs.yml runs the drift check instead. Anything not listed — a new
    # Markdown location, CHANGELOG.md, .github/**, a non-Markdown file under
    # docs/ — runs the full pipeline. Push only: `pull_request` stays
    # unfiltered so the required checks on main always report. Pinned and
    # explained by tools/scripts/check-workflow-paths.ts.
    paths-ignore:
      - 'docs/**/*.md'
      - 'docs/**/*.pdf'
      - 'README.md'
      - 'CLAUDE.md'
      - 'lessons.md'
      - 'lessons-archive.md'
      - 'API_SETUP.md'
      - 'APP_CONFIG.md'
      - 'OPERATIONS.md'
      - 'SETUP_STATUS.md'
      - 'INTEGRATIONS_ROADMAP.md'
      - 'apps/*/README.md'
      - 'packages/*/README.md'
      - 'tools/README.md'
      - '.claude/skills/**/*.md'
  pull_request:
    branches: [main, develop-2.2]
  # Invocabile da release.yml: un tag non fa scattare i trigger push/pull_request,
  # quindi senza questo non esisterebbe alcuna esecuzione di CI da cui dipendere
  # prima di costruire le immagini.
  workflow_call:

jobs:
  # Lint, typecheck e unit test stanno insieme perché condividono esattamente lo
  # stesso ambiente e nessuno dei tre ha bisogno di un database. Separarli
  # costava un secondo setup completo (checkout + install + prisma generate) per
  # guadagnare un parallelismo che `pnpm test` — cache turbo, nessun servizio —
  # non giustifica.
  checks:
    name: Lint, TypeCheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      - name: Lint
        run: pnpm lint

      - name: TypeCheck
        run: pnpm typecheck

      # I file sotto test/ non rientrano in tsconfig.json (rootDir: src).
      # Senza questo step il codice di test può marcire a livello di tipi senza segnalazione.
      - name: TypeCheck (test)
        run: pnpm typecheck:test

      # The drift checkers under tools/ are release gates, but tools/ is not a
      # workspace: `turbo run lint`/`typecheck` never saw it and tsx executes
      # TypeScript without checking it, so a type error in a gate would ship
      # silently. Its own standalone Node config covers it.
      - name: Lint & TypeCheck (tools)
        run: pnpm lint:tools && pnpm typecheck:tools

      # `scripts/` at the repository root is not a workspace either. It used to
      # sit inside the root tsconfig's `**/*.ts` include, but nothing ever
      # compiled that program — `pnpm typecheck` is `turbo run typecheck` and
      # turbo runs per-workspace scripts — so `rc-prod-clone.ts`, which drives a
      # production backup/restore, was checked by no gate at all. Its own step
      # rather than an extra command on the tools one: a distinct surface that
      # can break for its own reasons deserves a distinct red X.
      - name: TypeCheck (root scripts)
        run: pnpm typecheck:root

      # The checkers are release gates, so their own behavior is regression
      # tested: each invariant has a fixture proving it goes red. A checker only
      # ever seen green is assumed to block, not known to.
      - name: Control-plane tests
        run: pnpm test:tools

      # Skill e documentazione affermano fatti sulla codebase (path, simboli,
      # link) che possono driftare in silenzio: `luke-test` ha istruito per mesi
      # ad aggiungere le spec a un file eliminato. Qui quei fatti diventano
      # bloccanti.
      - name: Docs & skills drift
        run: pnpm check:drift

      - name: Unit tests
        run: pnpm test

      # `@luke/core` is ESM-only while `apps/api` and `packages/calendar` emit
      # CommonJS and `require()` it, which Node can only do for a synchronous
      # ESM graph. Every other tier above loads core through an ESM loader
      # (vitest, Vite, Next), so a top-level `await` entering that graph would
      # be green everywhere here and first fail as an API container that will
      # not boot. This step is the only one that requires the built package.
      - name: Module contract (require(esm))
        run: pnpm test:module-contract

      # The Next server/client boundary is enforced by the bundler and by
      # nothing earlier: a module that imports a Node builtin and reaches the
      # `[Client Component Browser]` layer fails `next build` with "Module not
      # found: Can't resolve 'fs'", while lint and tsc stay green (Monorepo
      # Audit Cycle 10, mutations 1–4). Before this step that build ran only in
      # the Docker builder stage at tag time, so such a leak surfaced at
      # release, not at push. Bounded to `apps/web`: no image, nothing
      # published, `.next` discarded with the runner. The dependency builds are
      # the Turbo tasks the TypeCheck step already cached. Last in the job by
      # design: the cheaper gates above it report first.
      #
      # Cache-safe for the variables it models: Turbo runs in its default
      # strict env mode, and the `@luke/web#build` entry in `turbo.json`
      # declares `INTERNAL_API_URL` (the rewrites branch in `next.config.js`)
      # and `NEXT_PUBLIC_*` (inlined into the bundle) as hashed inputs — a
      # different value is a different build, never a cache hit — and
      # `NEXTAUTH_SECRET`, `NEXT_TELEMETRY_DISABLED` and `NODE_OPTIONS` as
      # passthrough: they decide whether the build runs, not what it produces,
      # so they are visible to the task and absent from its hash. Anything
      # else the application reads from the environment is neither passed nor
      # hashed here. `NODE_ENV` is not set because `next build` forces
      # `production` itself.
      #
      # This is what a production build needs to execute its own code paths,
      # not a claim of parity with the Docker image. Hostnames are reserved
      # `.invalid` names: the build inlines and records them but resolves
      # nothing. `INTERNAL_API_URL` is set so the rewrites branch is exercised
      # rather than skipped; the secret is a placeholder no runtime reads; the
      # heap is the one the Dockerfile documents for the TypeScript phase.
      - name: Build (web)
        run: pnpm turbo run build --filter=@luke/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXTAUTH_SECRET: ci-build-placeholder-never-read-at-runtime
          NEXT_PUBLIC_API_URL: http://web.luke.invalid
          INTERNAL_API_URL: http://api.luke.invalid:3001
          NODE_OPTIONS: --max-old-space-size=4096

  # Own job, not a step in `checks`: the browser download is the dominant cost
  # here and would otherwise delay lint/typecheck feedback for every push. Same
  # reasoning that already keeps integration and migrations separate — anything
  # needing infrastructure the other steps do not.
  browser:
    name: Browser Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      - name: Install Chromium for Vitest Browser Mode
        run: pnpm --filter @luke/web exec playwright install --with-deps chromium

      - name: Browser component tests
        run: pnpm test:browser

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: luke_test
          POSTGRES_USER: luke
          POSTGRES_PASSWORD: luke_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luke -d luke_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://luke:luke_test@localhost:5432/luke_test

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      # The backup/restore suite spawns pg_dump and pg_restore. A client newer than the server
      # emits statements the server rejects (SET transaction_timeout, from pg_dump 17 on), which
      # --exit-on-error correctly refuses — so the suite would skip and protect nothing. Pin the
      # client to the service container's major, the pairing production runs
      # (apps/api/Dockerfile: postgresql16-client against postgres:16-alpine). The PATH entry is
      # what actually decides: /usr/bin/pg_dump is a wrapper that otherwise picks the newest
      # installed version.
      - name: Pin PostgreSQL client to 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Integration tests
        run: pnpm test:integration

  migrations:
    name: Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: luke_migrate
          POSTGRES_USER: luke
          POSTGRES_PASSWORD: luke_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luke -d luke_migrate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://luke:luke_migrate@localhost:5432/luke_migrate
      SHADOW_DATABASE_URL: postgresql://luke:luke_migrate@localhost:5432/luke_shadow

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      - name: Create shadow database
        run: |
          PGPASSWORD=luke_migrate psql -h localhost -U luke -d luke_migrate \
            -c 'CREATE DATABASE luke_shadow;'

      # Stesso comando di entrypoint.sh in produzione: se fallisce qui,
      # sarebbe fallito al deploy.
      - name: Apply migrations from scratch
        run: pnpm --filter @luke/db exec prisma migrate deploy

      # I file .prisma e prisma/migrations/ possono divergere silenziosamente.
      # --exit-code: 0 nessuna differenza, 2 drift rilevato.
      - name: Schema drift check
        run: |
          pnpm --filter @luke/db exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma \
            --exit-code

  # The aggregate gate: the stable candidate context for `main`'s ruleset,
  # which today still requires the individual job names and cannot keep that
  # list in step with this file. The switch is a separate remote change, made
  # once a real train PR has produced this context successfully; until then
  # this job reports like any other. Its `needs` is what will let one name
  # stand for all of them, and tools/scripts/check-workflow-paths.ts pins that
  # list to ci.yml's own jobs, along with the rest of this job.
  #
  # `always()` is what makes it a gate rather than a passenger: without it a
  # failed, cancelled or skipped dependency would skip this job too, and a
  # skipped check reports neutral rather than failed — worthless as a required
  # context once the ruleset names it. Running unconditionally, it accepts the
  # literal `success` and nothing else, and counts its arguments first because
  # a `needs` that resolved to nothing would otherwise leave the loop with no
  # iterations at all. The unquoted `$RESULTS`
  # is that word split, deliberately: shellcheck's SC2086 here is the intended
  # behaviour, and a one-line `run:` cannot carry a disable directive.
  #
  # `shell:` is spelled out because the script's semantics are bash's, and the
  # runner default is not part of any contract: whatever interprets this line
  # decides whether it asserts anything at all — `shell: echo {0}` would print
  # it and exit 0.
  gate:
    name: CI gate
    needs: [checks, browser, integration, migrations]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: echo "results=$RESULTS"; set -- $RESULTS; [ $# -gt 0 ] || exit 1; for r in "$@"; do [ "$r" = success ] || exit 1; done
