name: CI

on:
  push:
    branches: [main, develop-2.2]
  # `types:` is pinned because GitHub's default set omits `edited`, which is
  # what retargeting a pull request fires: without it, moving a PR onto either
  # protected target produces no new run and the required checks stay Pending
  # on a head SHA nothing judged.
  pull_request:
    branches: [main, develop-2.2]
    types: [opened, synchronize, reopened, edited]
  # Invocabile da release.yml: un tag non fa scattare i trigger push/pull_request,
  # quindi senza questo non esisterebbe alcuna esecuzione di CI da cui dipendere
  # prima di costruire le immagini.
  workflow_call:

jobs:
  # Lint, typecheck e unit test stanno insieme perché condividono esattamente lo
  # stesso ambiente e nessuno dei tre ha bisogno di un database. Separarli
  # costava un secondo setup completo (checkout + install + prisma generate) per
  # guadagnare un parallelismo che `pnpm test` — cache turbo, nessun servizio —
  # non giustifica.
  checks:
    name: Lint, TypeCheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      - name: Lint
        run: pnpm lint

      - name: TypeCheck
        run: pnpm typecheck

      # I file sotto test/ non rientrano in tsconfig.json (rootDir: src).
      # Senza questo step il codice di test può marcire a livello di tipi senza segnalazione.
      - name: TypeCheck (test)
        run: pnpm typecheck:test

      # Skill e documentazione affermano fatti sulla codebase (path, simboli,
      # link) che possono driftare in silenzio: `luke-test` ha istruito per mesi
      # ad aggiungere le spec a un file eliminato. Qui quei fatti diventano
      # bloccanti.
      - name: Docs & skills drift
        run: pnpm check:drift

      - name: Unit tests
        run: pnpm test

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: luke_test
          POSTGRES_USER: luke
          POSTGRES_PASSWORD: luke_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luke -d luke_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://luke:luke_test@localhost:5432/luke_test

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      - name: Integration tests
        run: pnpm test:integration

  migrations:
    name: Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: luke_migrate
          POSTGRES_USER: luke
          POSTGRES_PASSWORD: luke_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luke -d luke_migrate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://luke:luke_migrate@localhost:5432/luke_migrate
      SHADOW_DATABASE_URL: postgresql://luke:luke_migrate@localhost:5432/luke_shadow

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      - name: Create shadow database
        run: |
          PGPASSWORD=luke_migrate psql -h localhost -U luke -d luke_migrate \
            -c 'CREATE DATABASE luke_shadow;'

      # Stesso comando di entrypoint.sh in produzione: se fallisce qui,
      # sarebbe fallito al deploy.
      - name: Apply migrations from scratch
        run: pnpm --filter @luke/api exec prisma migrate deploy

      # schema.prisma e prisma/migrations/ possono divergere silenziosamente.
      # --exit-code: 0 nessuna differenza, 2 drift rilevato.
      - name: Schema drift check
        run: |
          pnpm --filter @luke/api exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --exit-code

  # The web image is the only place `next build` runs on this branch, and it is
  # built here from the real Dockerfile so a missing build prerequisite fails at
  # pull-request time instead of at tag time. v2.1.5 published an API image and
  # no web image because the builder stage never built `@luke/api`, whose
  # declarations `apps/web/tsconfig.json` references; nothing before the release
  # run executed that ordering.
  #
  # A host-level `turbo run build --filter=@luke/web` would not have caught it:
  # turbo builds workspace dependencies itself, so a Dockerfile missing that
  # step still succeeds. Only building the image exercises the ordering the
  # release actually uses.
  #
  # `push: false`, no registry login, no cache: nothing is published, and no
  # cached layer may stand in for a step this job exists to execute. The build
  # args are disposable non-secret placeholders on reserved `.invalid`
  # hostnames, which the build inlines but never resolves.
  web-image:
    name: Web Image Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build web image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://web.luke.invalid
            INTERNAL_API_URL=http://api.luke.invalid:3001
            APP_VERSION=ci

  # The aggregate gate: the stable candidate context for `main`'s ruleset,
  # which today still requires the individual job names and cannot keep that
  # list in step with this file. The switch is a separate remote change, made
  # once this context has reported on a real pull request; until then this job
  # reports like any other.
  #
  # `always()` is what makes it a gate rather than a passenger: without it a
  # failed, cancelled or skipped dependency would skip this job too, and a
  # skipped check reports neutral rather than failed — worthless as a required
  # context once the ruleset names it. Running unconditionally, it accepts the
  # literal `success` and nothing else, and counts its arguments first because
  # a `needs` that resolved to nothing would otherwise leave the loop with no
  # iterations at all. The unquoted `$RESULTS` is that word split, deliberately.
  #
  # `shell:` is spelled out because the script's semantics are bash's, and the
  # runner default is not part of any contract.
  gate:
    name: CI gate
    needs: [checks, integration, migrations, web-image]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: echo "results=$RESULTS"; set -- $RESULTS; [ $# -gt 0 ] || exit 1; for r in "$@"; do [ "$r" = success ] || exit 1; done
