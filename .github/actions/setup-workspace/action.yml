name: Setup workspace
description: >-
  pnpm, Node with cache, and the generated Prisma client. The setup was
  identical in four jobs: duplicated, a Node bump has to be made in four
  places, and forgetting one runs a job on a different version with nothing
  flagging it. The `checkout` stays with the caller — a local action is not
  reachable before the repo is on the runner.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Generate Prisma client
      shell: bash
      run: pnpm --filter @luke/db exec prisma generate
