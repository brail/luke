# Ephemeral PostgreSQL for the integration tests.
#
#   pnpm test:db:up      starts it (port 5434, no clash with dev:5432 or migrate:5433)
#   pnpm test:db:down    stops it and deletes the volume
#
# Starting the container is NOT enough: the suites read `TEST_DATABASE_URL`,
# which nobody sets locally (in CI it comes from the job's env).
#
#   pnpm test:integration:local     ← does both, use this
#
# In explicit form, if needed, with this file's values:
#
#   TEST_DATABASE_URL="postgresql://luke:luke_test@localhost:5434/luke_test" \
#     pnpm test:integration
#
# Without it the suite **fails** instead of skipping — on purpose: a green job with
# zero tests run is worse than a red one (see `apps/api/test/helpers/database.ts`).
# So the failure is correct, but the command that avoids it was written down
# nowhere: this block exists for that.
#
# `turbo.json` declares `env: ["TEST_DATABASE_URL"]` on the task, so the
# variable passes through turbo and the command also works from the root.
#
# No persistent volume: the data is disposable by construction.
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: luke_test
      POSTGRES_USER: luke
      POSTGRES_PASSWORD: luke_test
    ports:
      - '5434:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U luke -d luke_test']
      interval: 2s
      timeout: 3s
      retries: 20
