rules:
  - id: luke-trpc-middleware-before-input
    languages: [typescript]
    severity: ERROR
    message: >-
      `.use(withAuditLog(...))` and `.use(withIdempotency(...))` go AFTER
      `.input(...)`. A middleware chained before it receives an `input` that is
      not parsed yet: the defect produces no error and no red test, it simply
      empties the metadata. It has already cost two subsystems — every audit
      log lost its input metadata, and idempotency conflict detection never
      worked because the body was always hashed as "{}".
    patterns:
      - pattern-either:
          - pattern: $P.use(withAuditLog(...)).input(...)
          - pattern: $P.use(withIdempotency(...)).input(...)
    paths:
      include:
        - '/apps/api/src/routers/**'
