rules:
  - id: luke-mutation-requires-permission
    languages: [typescript]
    severity: WARNING
    message: >-
      tRPC mutation without .use(requirePermission(...)) in its chain: check
      that the endpoint is protected by an explicit permission check
      (best-effort, false positives expected — see CLAUDE.md RBAC).
    patterns:
      - pattern: $PROC. ... .mutation($HANDLER)
      - pattern-not: <... requirePermission(...) ...>
    paths:
      include:
        - '/apps/api/src/routers/**'
