rules:
  - id: luke-no-raw-pdf-printer
    languages: [typescript]
    severity: ERROR
    message: >-
      Motore pdfmake istanziato direttamente. Solo `lib/export/pdf.ts` può farlo:
      è l'unico punto in cui `setUrlAccessPolicy` e `setLocalAccessPolicy` sono
      chiuse, e il default di pdfmake è permissivo (fetch di URL remote e lettura
      dal filesystem locale a partire da una definizione di documento). Un printer
      costruito a mano non eredita nessuna policy. In più l'API interna
      `js/Printer` è cambiata fra pdfmake 0.2 e 0.3 senza che il typecheck se ne
      accorgesse, lasciando quattro export rotti in produzione. Usare
      `createPdfBuffer(def)`.
    # pdfmake 0.3 is reached through its public singleton (`require('pdfmake')`,
    # `createPdf`); the 0.2 `js/Printer` patterns stay as a guard against the old
    # internal API. `import type` from 'pdfmake/interfaces' is not matched.
    pattern-either:
      - pattern: require('pdfmake')
      - pattern: import $X from 'pdfmake'
      - pattern: import * as $X from 'pdfmake'
      - pattern: $P.createPdf(...)
      - pattern: require('pdfmake/js/Printer')
      - pattern: import $X from 'pdfmake/js/Printer'
      - pattern: $P.createPdfKitDocument(...)
    paths:
      include:
        - '/apps/api/src/**'
      exclude:
        - '/apps/api/src/lib/export/pdf.ts'
