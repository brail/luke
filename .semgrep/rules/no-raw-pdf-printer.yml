rules:
  - id: luke-no-raw-pdf-printer
    languages: [typescript]
    severity: ERROR
    message: >-
      pdfmake engine instantiated directly. Only `lib/export/pdf.ts` may do
      that: it is the only place where `setUrlAccessPolicy` and
      `setLocalAccessPolicy` are closed, and pdfmake's default is permissive
      (it fetches remote URLs and reads the local filesystem from a document
      definition). A hand-built printer inherits no policy. On top of that, the
      internal `js/Printer` API changed between pdfmake 0.2 and 0.3 without the
      typecheck noticing, leaving four exports broken in production. Use
      `createPdfBuffer(def)`.
    # pdfmake 0.3 is reached through its public singleton (`require('pdfmake')`,
    # `createPdf`); the 0.2 `js/Printer` patterns stay as a guard against the old
    # internal API. `import type` from 'pdfmake/interfaces' is not matched.
    pattern-either:
      - pattern: require('pdfmake')
      - pattern: import $X from 'pdfmake'
      - pattern: import * as $X from 'pdfmake'
      - pattern: $P.createPdf(...)
      - pattern: require('pdfmake/js/Printer')
      - pattern: import $X from 'pdfmake/js/Printer'
      - pattern: $P.createPdfKitDocument(...)
    paths:
      include:
        - '/apps/api/src/**'
      exclude:
        - '/apps/api/src/lib/export/pdf.ts'
