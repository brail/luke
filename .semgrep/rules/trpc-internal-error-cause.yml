rules:
  - id: luke-trpc-internal-error-cause
    languages: [typescript]
    severity: ERROR
    message: >-
      new TRPCError({ code: 'INTERNAL_SERVER_ERROR' }) inside a catch without `cause:` —
      the real cause disappears from the structured logs (the global onError in
      server.ts logs it only when present). Add `cause: <caught variable>`, binding
      the error first in a bare `catch {`. If the throw is not about the caught error,
      there is no cause to attach: say so in a
      `// nosemgrep: luke-trpc-internal-error-cause` with the reason.
    # `catch ($ERR)` also matches a bare `catch {` (the fixture pins it).
    patterns:
      - pattern: |
          catch ($ERR) {
            ...
            throw new TRPCError({ code: 'INTERNAL_SERVER_ERROR', ... });
          }
      - pattern-not: |
          catch ($ERR) {
            ...
            throw new TRPCError({ code: 'INTERNAL_SERVER_ERROR', ..., cause: $CAUSE, ... });
          }
    paths:
      include:
        - /apps/api/src/**/*.ts
