rules:
  - id: luke-no-direct-env
    languages: [typescript]
    severity: ERROR
    message: >-
      Runtime config comes from the AppConfig KV store (getConfigValue / the
      tRPC config router), not from process.env directly. Exceptions:
      infrastructure bootstrap (see CLAUDE.md Env Policy), and
      NEXT_PUBLIC_*/NODE_ENV/APP_VERSION (build-time metadata, not a secret)
      anywhere in the code.
    patterns:
      - pattern: process.env.$VAR
      - metavariable-regex:
          metavariable: $VAR
          regex: ^(?!NEXT_PUBLIC_)(?!NODE_ENV$)(?!APP_VERSION$).*
    paths:
      exclude:
        - '/apps/api/test/**'
        - '/apps/api/scripts/**'
        - '/packages/db/prisma.config.ts'
        - '/packages/db/src/client.ts'
        - '/apps/api/src/server.ts'
        - '/apps/api/src/instrument.ts'
        - '/apps/api/src/lib/cors.ts'
        - '/apps/api/src/lib/ldapAuth.ts'
        - '/apps/api/src/lib/storageUrl.ts'
        - '/apps/web/src/auth.ts'
        # Test runner code: it reads env by definition (baseURL, smoke
        # credentials, CI). Excluded as a tree, on the same footing as
        # /apps/api/test/** and /apps/api/scripts/**, not file by file.
        - '/apps/web/tests/**'
        - '/apps/web/playwright.config.ts'
        - '/packages/core/src/runtime/env.ts'
