rules:
  - id: luke-prisma-raw-unsafe
    languages: [typescript]
    severity: ERROR
    message: >-
      $queryRawUnsafe/$executeRawUnsafe are forbidden: use $queryRaw/$executeRaw
      with the Prisma.sql tagged template, never hand-interpolated strings.
    # Match the member expression, not the call: a call pattern such as
    # `$P.$queryRawUnsafe(...)` does not match a call with type arguments
    # (`$P.$queryRawUnsafe<T>(...)`), and neither does a `<$T>` variant. The
    # member expression covers both forms and an aliased reference as well.
    pattern-either:
      - pattern: $P.$queryRawUnsafe
      - pattern: $P.$executeRawUnsafe
    paths:
      exclude:
        - '/apps/api/test/**'

  - id: luke-nav-query-interpolation
    mode: taint
    languages: [typescript]
    severity: ERROR
    message: >-
      'company' interpolated into an MSSQL query without going through
      sanitizeCompany(): SQL injection risk on the table identifier. Always
      sanitize with sanitizeCompany() before interpolating.
    paths:
      include:
        - '/packages/nav/**'
    pattern-sources:
      - pattern: company
      - pattern: config.company
    pattern-sanitizers:
      - pattern: sanitizeCompany(...)
    pattern-sinks:
      - pattern: $REQ.query(...)
