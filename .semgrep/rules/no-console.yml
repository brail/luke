rules:
  - id: luke-no-console
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Use the logger, not console.* (a non-negotiable Luke pattern). API:
      ctx.logger (Fastify) or a child of the root logger,
      rootLogger.child({ module }) from apps/api/src/lib/logger.ts. Web:
      debugLog/debugWarn/debugError from lib/debug.ts.
    pattern: console.$METHOD(...)
    paths:
      exclude:
        - '/apps/api/test/**'
        - '/apps/api/scripts/**'
        - '/apps/api/prisma/**'
        - '/apps/web/tests/**'
        - '/scripts/**'
        - '/tools/**'
        - '/apps/web/src/lib/debug.ts'
