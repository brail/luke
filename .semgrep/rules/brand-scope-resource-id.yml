rules:
  - id: luke-brand-scope-resource-id
    languages: [typescript]
    severity: ERROR
    message: >-
      tRPC procedure that addresses a brand-scoped resource by id, with no
      guard. These procedures do not name a brand in their input: they reach
      it by resolving the record, so `luke-brand-scope-required` cannot see
      them. They were all unguarded — layouts, groups, rows, quotations,
      revisions, phase history. Use the resolvers in
      `services/brandScope.service.ts` (`resolveLayoutBrandAccess`,
      `resolveRowBrandAccess`, …): they take the brandId from the resolved
      record, never from an input field, and throw NOT_FOUND before FORBIDDEN.
    patterns:
      - pattern-either:
          - pattern: '$P. ... .input(z.object({ ..., $KEY: $Z, ... })). ... .query($H)'
          - pattern: '$P. ... .input(z.object({ ..., $KEY: $Z, ... })). ... .mutation($H)'
      # An explicit list, not `.*Id$`: a broad version fires on
      # `users.getById`, `season.delete` and half the repo, and a blocking rule
      # that flags correct code gets disabled within a week.
      - metavariable-regex:
          metavariable: $KEY
          regex: '^(collectionLayoutId|groupId|rowId|quotationId|revisionId|planningGroupId|calendarId)$'
      - pattern-not-regex: '(BrandAccess|getUserAllowedBrandIds|filterAllowedBrandIds)'
    paths:
      include:
        - '/apps/api/src/routers/**'
