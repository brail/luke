rules:
  - id: luke-fastify-plugin-leak
    languages: [typescript]
    severity: ERROR
    message: >-
      A route file must not register plugins inside `fp()`. `fastify-plugin`
      breaks encapsulation on purpose: the plugin lands in the root scope and
      becomes global for the whole server. It already happened with the
      brandLogo.routes.ts rate limiter, which replaced the global limit with
      30 req/min per user on every route in production. Export a plain async
      function — no file in routes/ uses decorate or addHook, so none of them
      needs fp().
    patterns:
      - pattern-inside: |
          fp(async ($APP, ...) => { ... }, ...)
      - pattern: $APP.register(...)
    paths:
      include:
        - '/apps/api/src/routes/**'
