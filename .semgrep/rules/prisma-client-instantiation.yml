rules:
  - id: luke-prisma-client-instantiation
    languages: [typescript]
    severity: ERROR
    message: >-
      Do not instantiate PrismaClient here. The client is built in one place,
      createPrismaClient() in @luke/db, which mounts the PrismaPg driver
      adapter and refuses to start without a connection string; tests go
      through createTestPrismaClient() in test/helpers/database.ts, which
      calls it. Prisma 7 removed `datasources` and `datasourceUrl` from the
      constructor: a `new PrismaClient()` without an adapter does not point at
      the database you think it does, and in tests it ends up on the
      development one. Real regression: the test helpers stayed on SQLite for
      months without anything flagging it.
    pattern: new PrismaClient(...)
    paths:
      # The only legitimate place to construct the client. Every other site
      # must go through createPrismaClient().
      exclude:
        - '/packages/db/src/client.ts'
