rules:
  - id: luke-prisma-client-instantiation
    languages: [typescript]
    severity: ERROR
    message: >-
      Non istanziare PrismaClient qui. Il client si costruisce in un solo posto,
      createPrismaClient() in @luke/db, che monta il driver adapter PrismaPg e
      rifiuta di partire senza connection string; nei test passa da
      createTestPrismaClient() in test/helpers/database.ts, che la chiama.
      Prisma 7 ha rimosso `datasources` e `datasourceUrl` dal costruttore: un
      `new PrismaClient()` senza adapter non punta al database che credi, e nei
      test finisce su quello di sviluppo. Regressione reale: gli helper di test
      sono rimasti su SQLite per mesi senza che nulla lo segnalasse.
    pattern: new PrismaClient(...)
    paths:
      # L'unica sede legittima di costruzione del client. Ogni altro punto deve
      # passare da createPrismaClient().
      exclude:
        - '/packages/db/src/client.ts'
