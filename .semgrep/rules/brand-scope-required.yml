rules:
  - id: luke-brand-scope-required
    languages: [typescript]
    severity: ERROR
    message: >-
      Procedura tRPC con brandId in input senza guard di brand scope.
      `requirePermission` risponde a "questo ruolo può leggere i prezzi?", non a
      "questo utente può leggere i prezzi DI QUESTO brand?". Un editor con il
      permesso ma fuori dallo scope del team leggeva dati di brand altrui
      passandone l'UUID. Usare `assertBrandAccess(ctx, brandId)` da
      `services/context.service.ts`; per le risorse identificate da un altro id
      (layout, riga) passare il brandId risolto dal record, mai un campo di input.
    patterns:
      - pattern-either:
          - pattern: '$P. ... .input(z.object({ ..., brandId: $Z, ... })). ... .query($H)'
          - pattern: '$P. ... .input(z.object({ ..., brandId: $Z, ... })). ... .mutation($H)'
      # Testuale sulla regione matchata, non `pattern-not` strutturale: con
      # `<... f(...) ...>` semgrep continuava a segnalare anche le procedure
      # correttamente guardate, e una regola bloccante che produce falsi positivi
      # finisce disattivata — che è peggio di non averla.
      - pattern-not-regex: '(assertBrandAccess|getUserAllowedBrandIds|filterAllowedBrandIds)'
    paths:
      include:
        - 'apps/api/src/routers/**'
