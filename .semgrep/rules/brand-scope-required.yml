rules:
  - id: luke-brand-scope-required
    languages: [typescript]
    severity: ERROR
    message: >-
      tRPC procedure with a brandId in its input and no brand-scope guard.
      `requirePermission` answers "can this role read prices?", not "can this
      user read prices FOR THIS brand?". An editor who held the permission but
      sat outside the team's scope read other brands' data by passing their
      UUID. Use `assertBrandAccess(ctx, brandId)` from
      `services/context.service.ts`; for resources identified by another id
      (layout, row) pass the brandId resolved from the record, never an input
      field.
    patterns:
      - pattern-either:
          - pattern: '$P. ... .input(z.object({ ..., $KEY: $Z, ... })). ... .query($H)'
          - pattern: '$P. ... .input(z.object({ ..., $KEY: $Z, ... })). ... .mutation($H)'
      # A metavariable, not the literal key `brandId`: `copyFromSeason` takes
      # `fromBrandId`/`toBrandId` and `cloneFromBrandSeason` takes
      # `sourceBrandId`/`targetBrandId`, and with a fixed key they were
      # invisible — exactly the two procedures that clone across brands, where
      # a mistake costs the most.
      - metavariable-regex:
          metavariable: $KEY
          regex: '^\w*[Bb]randId$'
      # Textual on the matched region, not a structural `pattern-not`: with
      # `<... f(...) ...>` semgrep kept flagging correctly guarded procedures
      # too, and a blocking rule that produces false positives ends up
      # disabled — which is worse than not having it.
      # `BrandAccess` covers the whole family: with a literal `assertBrandAccess`,
      # a procedure guarded by `resolveRowBrandAccess` was still flagged.
      - pattern-not-regex: '(BrandAccess|getUserAllowedBrandIds|filterAllowedBrandIds)'
    paths:
      include:
        - '/apps/api/src/routers/**'
