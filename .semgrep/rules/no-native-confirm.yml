rules:
  - id: luke-no-native-confirm
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Use <ConfirmDialog> from components/ConfirmDialog.tsx, never the
      browser's native confirm (a non-negotiable Luke pattern). The native
      dialog ignores the theme, cannot be tested and does not match the rest
      of the UI.
    pattern-either:
      - pattern: globalThis.confirm(...)
      - pattern: window.confirm(...)
    paths:
      include:
        - '/apps/web/src/**'
