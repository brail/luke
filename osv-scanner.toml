[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"
ignoreUntil = 2026-11-03T00:00:00Z
reason = "sprintf-js <=1.1.3 denial of service through unbounded precision specifiers; no fixed version exists. Reached via @luke/nav -> mssql -> tedious, which runs in production, but the vulnerable path never does: the precision comes from the format string, and tedious only passes literal format strings of its own (login7-payload.js, prelogin-payload.js, packet.js, metadata-parser.js, value-parser.js), never caller- or server-supplied ones."
