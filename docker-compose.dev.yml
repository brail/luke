services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       luke
      POSTGRES_USER:     luke
      POSTGRES_PASSWORD: luke_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luke -d luke"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    environment:
      S3_ROOT_USER:     s3admin
      S3_ROOT_PASSWORD: s3adminpwd
    ports:
      - "8333:8333"  # S3 API
      - "9333:9333"  # Master (cluster status / healthcheck; dev-only convenience)
      - "8888:8888"  # Filer UI (browse buckets/files; dev-only convenience)
    volumes:
      - ./docker/seaweedfs/entrypoint.sh:/docker-entrypoint.sh:ro
      - seaweedfs_dev_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_dev_data:
  seaweedfs_dev_data:
