packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  '@prisma/engines': true
  '@prisma/client': true
  argon2: true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - prettier@3.8.5
  - electron-to-chromium

overrides:
  uuid@<11.1.1: '>=11.1.1'
  postcss@<8.5.18: '>=8.5.18'
  # Range capped to the 3.x line — nanoid 4+ is ESM-only and postcss requires CJS.
  nanoid: '>=3.3.17 <4' # GHSA-2v37-7h3g-55p8, transitive via postcss
  '@hono/node-server@<1.19.13': '>=1.19.13'
  '@opentelemetry/propagator-jaeger': '2.9.0'
  # GHSA-mh99-v99m-4gvg copre <= 5.0.7 in un unico range: non esiste una patch
  # nelle linee 1.x e 2.x, l'unica versione sana è la 5.0.8. Ha export duali
  # (ESM + CJS), quindi i consumer CJS come minimatch@3 continuano a funzionare.
  brace-expansion: '>=5.0.9'
  # Transitive only, through Prisma's `@prisma/dev` (via `@hono/node-server`);
  # no workspace manifest depends directly on Hono. This override moves the
  # resolved transitive version without coupling the advisory fix to a Prisma
  # upgrade. Floor was >=4.12.34 for GHSA-8j4g-w8fx-2239; raised to
  # 4.13.5 for GHSA-crvj-82cr-hjcx (CVE-2026-84363, query parser reads past the
  # URL fragment), GHSA-g6gw-c38x-mqfc (CVE-2026-84364, unbounded dot-notation
  # nesting in parseBody) and GHSA-gqvv-2mrq-wpjv (CVE-2026-84365, toSSG still
  # writes outside the output directory). The <5 cap stops an uncapped floor
  # from silently crossing into Hono 5.
  hono: '>=4.13.5 <5'
  find-my-way: '>=9.7.0' # GHSA-c96f-x56v-gq3h — DoS via HTTP/2
  # Transitive via @prisma/config. GHSA-ggr8-5vv4-36mx — deepmerge()/
  # deepmergeInto() stack exhaustion on a crafted self-referential object
  # graph (DoS). Not a direct dependency anywhere in the workspace.
  deepmerge-ts: '>=8.0.2'
  # Range e non pin esatto: un pin fissa la versione anche quando esce la patch,
  # e `pnpm update` non può scavalcarlo. GHSA-7p8r-x3mc-p8w7 su <=3.1.4.
  # Il limite superiore c'è perché un override senza tetto trascina ogni consumer
  # transitivo su una major nuova: `>=3.1.5` da solo risolveva a 4.1.2.
  # Floor raised to 3.1.6 for GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc,
  # GHSA-fph4-wmhf-6fwf and GHSA-jqff-g426-hqxp (host confusion via skipped IDN
  # canonicalisation) on <=3.1.5.
  fast-uri: '>=3.1.6 <4'
  # GHSA-5p4m-2wfm-xmqj on <=4.3.0. Range, for the same reason as fast-uri.
  # Floor raised to 4.3.2 for GHSA-2883-xcg3-v3hh (prototype pollution via a
  # crafted document) on <=4.3.1 — the version this floor previously allowed.
  # Same cap, same intent: it still excludes <=4.3.0 and still refuses to drag
  # transitive consumers onto a new major.
  js-yaml: '>=4.3.2 <5'
  protobufjs: '7.6.5'
  # GHSA-rgj7-g3m4-5g8c (bundled libheif) is fixed in 0.35.4. This was an exact
  # pin, and an exact pin outranks every workspace range: it kept forcing the
  # vulnerable 0.35.0 even after the patch shipped, so bumping the dependency
  # in apps/api alone could not move the resolved version. A capped range
  # takes the patch and every later 0.35.x, while <0.36 still refuses to drag
  # a new minor of a native binary in silently.
  sharp: '>=0.35.4 <0.36'
  valibot: '>=1.4.2'
  # Transitive via prisma: the CLI package declares mysql2 as a regular
  # dependency pinned to an exact version (prisma@7.8.0 -> "mysql2": "3.15.3"),
  # so nothing in the workspace can move it and Dependabot reports
  # security_update_not_possible -- it has no requirement to unlock and does not
  # author pnpm overrides. This workspace's only schema.prisma declares
  # provider = "postgresql"; @prisma/client's runtime code never references
  # mysql2, so the vulnerable code sits on disk and is never loaded.
  # Covers GHSA-3f6p-5ww8-9rcr (fixed 3.22.0) and GHSA-rgwj-5xj2-c3m3
  # (fixed 3.23.1) in one range. Range, not a pin, for the same reason as
  # fast-uri/js-yaml above; capped below 4.x so a future breaking major cannot
  # be dragged in silently.
  mysql2: '>=3.23.1 <4'
  # Transitive only: no workspace manifest depends on browserslist. Its three
  # requirers all declare ranges that already admit the patched line
  # (@babel/helper-compilation-targets ^4.24.0, autoprefixer ^4.28.4,
  # update-browserslist-db peer >= 4.21.0), so this is a floor rather than an
  # unlock -- `pnpm update` reaches it too, but only by re-resolving the whole
  # tree, which drags unrelated packages (next's postcss) along with it.
  # GHSA-73wf-gq98-2v4g and GHSA-c83g-rgw3-j3cx, both fixed in 4.28.7.
  # Capped below 5.x for the same reason as fast-uri/js-yaml/mysql2 above.
  browserslist: '>=4.28.7 <5'
