packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  '@prisma/engines': true
  '@prisma/client': true
  argon2: true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Supply-chain quarantine: a version younger than 72h is invisible to
# resolution, and `pnpm install --frozen-lockfile` re-applies the same cutoff to
# every lockfile entry — so this governs CI, not only `pnpm update`. Strict is
# explicit rather than inherited: with `false`, a range whose only match is
# younger than the window installs the immature version instead of failing.
# Exclusions are added with the dependency that needs one, never ahead of it.
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - electron-to-chromium

overrides:
  uuid@<11.1.1: '>=11.1.1'
  postcss@<8.5.18: '>=8.5.18'
  # Range capped to the 3.x line — nanoid 4+ is ESM-only and postcss requires CJS.
  nanoid: '>=3.3.17 <4' # GHSA-2v37-7h3g-55p8, transitive via postcss
  '@hono/node-server@<1.19.13': '>=1.19.13'
  '@opentelemetry/propagator-jaeger': '2.9.0'
  # GHSA-mh99-v99m-4gvg copre <= 5.0.7 in un unico range: non esiste una patch
  # nelle linee 1.x e 2.x, l'unica versione sana è la 5.0.8. Ha export duali
  # (ESM + CJS), quindi i consumer CJS come minimatch@3 continuano a funzionare.
  brace-expansion: '>=5.0.9'
  hono: '>=4.12.34' # GHSA-8j4g-w8fx-2239
  find-my-way: '>=9.7.0' # GHSA-c96f-x56v-gq3h — DoS via HTTP/2
  # Transitive via @prisma/config. GHSA-ggr8-5vv4-36mx — deepmerge()/
  # deepmergeInto() stack exhaustion on a crafted self-referential object
  # graph (DoS). Not a direct dependency anywhere in the workspace.
  deepmerge-ts: '>=8.0.2'
  # Range e non pin esatto: un pin fissa la versione anche quando esce la patch,
  # e `pnpm update` non può scavalcarlo. GHSA-7p8r-x3mc-p8w7 su <=3.1.4.
  # Il limite superiore c'è perché un override senza tetto trascina ogni consumer
  # transitivo su una major nuova: `>=3.1.5` da solo risolveva a 4.1.2.
  fast-uri: '>=3.1.5 <4'
  # GHSA-5p4m-2wfm-xmqj su <=4.3.0. Range, per la stessa ragione di fast-uri.
  js-yaml: '>=4.3.1 <5'
  protobufjs: '7.6.5'
  sharp: '0.35.4'
  valibot: '>=1.4.2'
  # Transitive via prisma (the CLI package bundles mysql2 as a regular
  # dependency, even though this workspace's only schema.prisma declares
  # provider = "postgresql", and @prisma/client's own runtime code never
  # references it — nothing in this repo can reach the vulnerable path).
  # GHSA-rgwj-5xj2-c3m3 on <=3.23.0 (decompression handling). Range, not a
  # pin, for the same reason as fast-uri/js-yaml above: prisma pins mysql2 to
  # an exact version, so pnpm update cannot move past it without this
  # override, and a later patch should be picked up without editing this
  # file again.
  mysql2: '>=3.23.1 <4'
