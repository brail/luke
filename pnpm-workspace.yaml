packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  '@prisma/client': true
  argon2: true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Supply-chain quarantine: a version younger than 72h is invisible to
# resolution, and `pnpm install --frozen-lockfile` re-applies the same cutoff to
# every lockfile entry — so this governs CI, not only `pnpm update`. Strict is
# explicit rather than inherited: with `false`, a range whose only match is
# younger than the window installs the immature version instead of failing.
# Exclusions are added with the dependency that needs one, never ahead of it.
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - electron-to-chromium

overrides:
  # GHSA-w5hq-g745-h8pq (CVE-2026-41907): missing buffer bounds check in v3/v5/v6, fixed in 11.1.1
  # (and 12.0.1, 13.0.1 on lines no consumer uses). exceljs declares uuid ^8.3.0, a line with no
  # fixed release, so it is lifted past it on purpose.
  uuid@<11.1.1: '>=11.1.1'
  # GHSA-mh99-v99m-4gvg covers <= 5.0.7 in a single range: there is no patch on
  # the 1.x and 2.x lines, and the only healthy version was 5.0.8. It has dual
  # exports (ESM + CJS), so CJS consumers such as minimatch@3 keep working.
  # Floor raised to 5.0.9 for GHSA-rgw5-rvv9-x895 on 5.0.8, then to 5.0.12 for
  # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7 and GHSA-q2hr-2g5m-vwhr (<= 5.0.11).
  # Capped below 6 so a future major cannot be forced on every consumer.
  brace-expansion: '>=5.0.12 <6'
  # Transitive via @prisma/config. GHSA-ggr8-5vv4-36mx — deepmerge()/
  # deepmergeInto() stack exhaustion on a crafted self-referential object
  # graph (DoS). Not a direct dependency anywhere in the workspace.
  deepmerge-ts: '>=8.0.2'
  # GHSA-333x-w4r6-6crp, GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr, GHSA-xhq7-xmqj-769h: URI scheme
  # spoofing and host confusion, fixed in 3.1.9 and 4.2.3. `pnpm update` moves the 4.x line but
  # keeps ajv@8's 3.x copy at 3.1.8, although its `^3.0.1` admits the fix (a fresh install picks
  # 3.1.9). Capped below 4 so ajv@8 is not lifted onto the 4.x line.
  fast-uri@<3.1.9: '>=3.1.9 <4'
  # GHSA-xcx6-jx8p-x3h5: MSAL Node's authorization-code flow may disclose parameters to an
  # attacker-controlled endpoint, fixed in 7.1.0. Transitive via @luke/nav -> mssql -> tedious ->
  # @azure/identity, whose latest release (4.14.0, and the 4.15 beta) still declares ^6: lifted
  # onto 7 on purpose. Every MSAL export identity uses is still in 7.1.0, and Luke authenticates
  # to SQL Server with a password, so MSAL never runs. Remove once @azure/identity declares ^7.
  '@azure/msal-node': '>=7.1.0 <8'
