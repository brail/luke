# ──────────────────────────────────────────────────────────────────────────────
# Luke — Production Stack (Portainer)
#
# Runs the images release.yml publishes to ghcr.io from a release tag; nothing
# here builds an image.
#
# Self-contained: the stack must deploy from this file alone, without a checkout
# of the repository. No service may reference a repository path (relative bind
# mount, `build:`, `env_file:`).
#
# Environment variables (set in Portainer Stack → Env). Never put `$` in a value:
# compose interpolates it. `openssl rand -hex 24` gives a safe value.
# Required — the deploy stops without them:
#   LUKE_VERSION           — release to run, without the "v", e.g. 3.0.0
#   POSTGRES_PASSWORD      — strong random password for the PostgreSQL user
#   NEXTAUTH_SECRET        — random string (openssl rand -base64 32)
#   PUBLIC_HOSTNAME        — public hostname, e.g. luke.example.com
#   S3_ROOT_USER           — S3 storage admin username
#   S3_ROOT_PASSWORD       — S3 storage admin password (strong, 32+ chars)
# Optional:
#   COOKIE_SECURE          — "true" if behind HTTPS; default "false"
#   LUKE_EDGE_SUBNET       — subnet of the `edge` network; default 10.254.10.0/24
# ──────────────────────────────────────────────────────────────────────────────

x-logging: &logging
  driver: local
  options:
    max-size: '10m'
    max-file: '5'

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: luke
      POSTGRES_USER: luke
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U luke -d luke']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # ── Fastify API ──────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/brail/luke-api:${LUKE_VERSION:?LUKE_VERSION not set}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Same interpolation as the `edge` network below: the subnet Docker
      # builds and the range apps/api trusts cannot drift apart.
      LUKE_TRUSTED_PROXY_CIDR: ${LUKE_EDGE_SUBNET:-10.254.10.0/24}
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://luke:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}@postgres:5432/luke
      # CORS: browser requests go through the web container (no direct API access)
      LUKE_CORS_ALLOWED_ORIGINS: ''
    volumes:
      # The master key (/root/.luke/secret.key) lives here. NEVER delete this
      # volume: the key decrypts the stored secrets and every backup, and the
      # API's token secrets are derived from it (ADR-020).
      - api_data:/root/.luke
    networks:
      - edge
      - data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *logging

  # ── Next.js web ───────────────────────────────────────────────────────────────
  web:
    image: ghcr.io/brail/luke-web:${LUKE_VERSION:?LUKE_VERSION not set}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      # Internal Docker URL used by Next.js SSR and middleware
      INTERNAL_API_URL: http://api:3001
      # NextAuth
      NEXTAUTH_URL: http://${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME not set}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET not set}
      # Set to "true" when serving over HTTPS, "false" for plain HTTP
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    networks:
      - edge
    logging: *logging

  # ── SeaweedFS object storage (S3-compatible) ──────────────────────────────────
  seaweedfs:
    # Pinned: the env-var admin identity below is verified on this version;
    # re-verify it (anonymous request refused) before bumping.
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    # No bind mount: the stack deploys from this file alone (see the header).
    # `weed` runs directly (the image entrypoint would add its own volume
    # flags). -volume.max=100: the default 8 volume slots stop writes at ~8 buckets
    # (one volume per bucket), and Luke has ~9.
    entrypoint: ["/usr/bin/weed"]
    command: ["server", "-dir=/data", "-s3", "-ip.bind=0.0.0.0", "-volume.max=100"]
    environment:
      # The S3 gateway's only identity when no -s3.config file and no filer IAM
      # config exist. Without it the gateway would accept anonymous requests, so
      # an unset variable stops the deploy (`:?`).
      AWS_ACCESS_KEY_ID:     ${S3_ROOT_USER:?S3_ROOT_USER not set}
      AWS_SECRET_ACCESS_KEY: ${S3_ROOT_PASSWORD:?S3_ROOT_PASSWORD not set}
    volumes:
      - seaweedfs_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

volumes:
  postgres_data:
  api_data:
  seaweedfs_data:

networks:
  # apps/web -> apps/api only. The subnet is deterministic so apps/api can be
  # told which range its reverse proxy connects from; override LUKE_EDGE_SUBNET
  # on a host where this range collides with something else.
  edge:
    ipam:
      config:
        - subnet: ${LUKE_EDGE_SUBNET:-10.254.10.0/24}

  # postgres and seaweedfs live here and nowhere else. `internal: true` gives
  # the network no gateway, so nothing on it can reach — or be reached from —
  # outside the stack. apps/api is the only service on both, which is what makes
  # "only apps/web can be apps/api's peer" a property of the topology rather
  # than an assumption in a comment.
  data:
    internal: true
