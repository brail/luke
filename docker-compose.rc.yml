# ──────────────────────────────────────────────────────────────────────────────
# Luke — RC Stack (Portainer)
#
# Stack running parallel to production, for release candidates (vX.Y.Z-rc.N).
# Runs the candidate named by LUKE_VERSION, built by GitHub Actions.
#
# Distinct host ports, so it can coexist with the prod stack:
#   web: 3010 (prod uses 3000)
#
# Self-contained: the stack must deploy from this file alone, without a checkout
# of the repository. No service may reference a repository path (relative bind
# mount, `build:`, `env_file:`).
#
# Required environment variables (set in Portainer Stack → Env). Never put `$` in
# a value: compose interpolates it. `openssl rand -hex 24` gives a safe value.
#   LUKE_VERSION          — candidate to run, without the "v", e.g. 3.0.0-rc.3
#   POSTGRES_PASSWORD_RC  — DB password, separate from prod
#   NEXTAUTH_SECRET_RC    — secret, separate from prod
#   RC_PUBLIC_HOSTNAME    — RC hostname, e.g. rc.luke.febos.local
#   COOKIE_SECURE         — "true" for HTTPS, "false" for HTTP
#   S3_ROOT_USER_RC       — S3 storage admin username (RC)
#   S3_ROOT_PASSWORD_RC   — S3 storage admin password (RC, 32+ chars)
#
# Nginx Proxy Manager: create a new proxy host
#   Domain: rc.luke.febos.local  →  Forward: http://localhost:3010
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL (isolated instance for RC) ────────────────────────────────────
  postgres-rc:
    networks:
      - data
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: luke
      POSTGRES_USER: luke
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_RC}
    volumes:
      - postgres_rc_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U luke -d luke']
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  # ── Fastify API (RC) ─────────────────────────────────────────────────────────
  api-rc:
    networks:
      - edge
      - data
    image: ghcr.io/brail/luke-api:${LUKE_VERSION:?LUKE_VERSION not set}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres-rc:
        condition: service_healthy
    environment:
      # Same interpolation as the `edge` network below: the subnet Docker
      # builds and the range apps/api trusts cannot drift apart.
      LUKE_TRUSTED_PROXY_CIDR: ${LUKE_RC_EDGE_SUBNET:-10.254.20.0/24}
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://luke:${POSTGRES_PASSWORD_RC}@postgres-rc:5432/luke
      LUKE_CORS_ALLOWED_ORIGINS: ''
    volumes:
      - api_rc_data:/root/.luke
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  # ── Next.js web (RC) — exposed on port 3010 ──────────────────────────────────
  web-rc:
    networks:
      - edge
    image: ghcr.io/brail/luke-web:${LUKE_VERSION:?LUKE_VERSION not set}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      api-rc:
        condition: service_started
    ports:
      - '3010:3000'
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api-rc:3001
      NEXTAUTH_URL: http://${RC_PUBLIC_HOSTNAME}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET_RC}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  # ── SeaweedFS object storage (RC, S3-compatible) ──────────────────────────────
  seaweedfs-rc:
    networks:
      - data
    # Pinned: the env-var admin identity below is verified on this version;
    # re-verify it (anonymous request refused) before bumping.
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    # No bind mount: the stack deploys from this file alone (see the header).
    # `weed` runs directly (the image entrypoint would add its own volume
    # flags). -volume.max=100: the default 8 volume slots stop writes at ~8 buckets
    # (one volume per bucket), and Luke has ~9.
    entrypoint: ["/usr/bin/weed"]
    command: ["server", "-dir=/data", "-s3", "-ip.bind=0.0.0.0", "-volume.max=100"]
    environment:
      # The S3 gateway's only identity when no -s3.config file and no filer IAM
      # config exist. Without it the gateway would accept anonymous requests, so
      # an unset variable stops the deploy (`:?`).
      AWS_ACCESS_KEY_ID:     ${S3_ROOT_USER_RC:?S3_ROOT_USER_RC not set}
      AWS_SECRET_ACCESS_KEY: ${S3_ROOT_PASSWORD_RC:?S3_ROOT_PASSWORD_RC not set}
    volumes:
      - seaweedfs_rc_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_rc_data:
  api_rc_data:
  seaweedfs_rc_data:

networks:
  # apps/web -> apps/api only. The subnet is deterministic so apps/api can be
  # told which range its reverse proxy connects from; override LUKE_RC_EDGE_SUBNET
  # on a host where this range collides with something else.
  edge:
    ipam:
      config:
        - subnet: ${LUKE_RC_EDGE_SUBNET:-10.254.20.0/24}

  # postgres and seaweedfs live here and nowhere else. `internal: true` gives
  # the network no gateway, so nothing on it can reach — or be reached from —
  # outside the stack. apps/api is the only service on both, which is what makes
  # "only apps/web can be apps/api's peer" a property of the topology rather
  # than an assumption in a comment.
  data:
    internal: true
